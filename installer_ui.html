<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surface Studio 安装</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#29424a;background:#edf3f3;font-size:15px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0 0,#d6e9de,transparent 65%),radial-gradient(ellipse at 100% 20%,#dbe5f6,transparent 70%);min-height:100vh;padding:32px}header{display:flex;gap:16px;align-items:center;margin-bottom:28px}.mark{width:55px;height:55px;background:#355b60;color:#cde8da;border-radius:18px;display:grid;place-items:center;font-weight:650;font-size:22px;box-shadow:0 8px 22px #274d4b22}h1{font-size:25px;letter-spacing:1px;margin:0 0 5px}p{margin:7px 0;line-height:1.7;color:#627780}h2{font-size:17px;margin:0}small{color:#6e8188}section{padding:22px;margin-bottom:16px;background:#ffffffb0;border:1px solid #fff;border-radius:20px;box-shadow:0 6px 25px #29424a06}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.step{color:#6e9a89;font-size:13px;margin-right:10px}button{font:inherit;border:1px solid #cedcde;color:#35535b;background:#ffffff85;border-radius:10px;padding:9px 15px;cursor:pointer}button:hover{background:#fff}button:focus-visible,input:focus-visible{outline:3px solid #93b9aa;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:10px;align-items:center}.path{flex:1;width:100%;font:inherit;background:#edf2f480;color:#314c55;border:1px solid #d7e1e3;border-radius:10px;padding:12px;min-width:0}.hint{font-size:13px;margin-top:10px}.blender{display:flex;gap:12px;padding:13px 0;border-top:1px solid #dfe7e8;align-items:flex-start}.blender:first-child{border-top:0}.blender input{accent-color:#557f70;width:18px;height:18px;margin-top:4px}.blender b{display:block;margin-bottom:3px}.blender .location{font-size:12px;overflow-wrap:anywhere;color:#7a8c92}.blender .reason{font-size:13px;margin:5px 0;color:#5e8375}.blender.unsupported .reason{color:#99734d}#versions{max-height:245px;overflow:auto;padding-right:6px}footer{display:flex;align-items:center;gap:12px;padding:6px 0}#stage{flex:1;color:#61777f;font-size:14px}#install{background:#4f7869;color:white;border:0;padding:13px 23px}#install:hover{background:#416859}#error{white-space:pre-wrap;color:#9c513d;font-size:14px;margin:12px 0}#results:empty{display:none}#results{padding:15px 20px}.result{padding:8px 0;line-height:1.6;font-size:14px}.ok{color:#3d785e}.fail{color:#98603e}.result span{display:block;color:#627780}#launch{display:none}.busy-indicator{width:8px;height:8px;border-radius:50%;background:#739f8c;display:inline-block;margin-right:7px}.busy .busy-indicator{animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.3}}@media(max-width:800px){body{padding:22px}.heading{flex-wrap:wrap}}
body{padding-bottom:105px}footer{position:fixed;left:0;right:0;bottom:0;padding:15px 32px;background:#edf3f3ed;border-top:1px solid #fff;backdrop-filter:blur(16px);z-index:5}
</style>
<header><div class="mark">SS</div><div><h1>SURFACE STUDIO</h1><small>本地材质管理 · 一次安装，连接 Blender</small></div></header>
<section><div class="heading"><h2><span class="step">01</span>安装 Surface Studio</h2><small id="versions-label">软件与插件版本</small></div><div class="row"><input class="path" id="destination" aria-label="软件安装位置"><button id="folder">更改位置</button></div><p class="hint">为当前用户安装，无需管理员权限。更新时选择原软件文件夹，保留收藏、素材库和设置。</p></section>
<section><div class="heading"><h2><span class="step">02</span>连接你的 Blender</h2><div class="row"><button id="scan">重新检测</button><button id="add">手动选择</button></div></div><div id="versions"><p>正在检测本机 Blender…</p></div><p class="hint">自动安装并启用兼容插件，配置 SS 路径。便携版可手动选择 blender.exe。请先保存工作并关闭 Blender。</p><p class="hint">未检测到 Blender 也可安装 SS，之后重新运行本安装器添加连接。</p></section>
<section id="results" aria-live="polite"></section><div id="error" role="alert"></div>
<footer><div id="stage" role="status"><i class="busy-indicator"></i><span>准备安装</span></div><button id="launch">打开 Surface Studio</button><button id="install">安装并连接</button></footer>
<script>
const $=s=>document.querySelector(s);let api,items=[],busy=false;
function setBusy(value){busy=value;document.body.classList.toggle('busy',value);document.querySelectorAll('button,input').forEach(e=>e.disabled=value);document.querySelectorAll('.unsupported input').forEach(e=>e.disabled=true)}
function renderItems(next){items=next;$('#versions').replaceChildren();if(!items.length){$('#versions').textContent='未检测到 Blender，可手动选择，或直接安装 SS。';return}for(const item of items){const label=document.createElement('label');label.className='blender'+(item.supported?'':' unsupported');const input=document.createElement('input');input.type='checkbox';input.checked=!!item.supported;input.disabled=!item.supported;input.value=item.path;const text=document.createElement('div');for(const [tag,cls,value]of [['b','','Blender '+item.version_string],['div','location',item.path],['div','reason',item.reason]]){const e=document.createElement(tag);e.className=cls;e.textContent=value;text.append(e)}label.append(input,text);$('#versions').append(label)}}
function renderResults(results){$('#results').replaceChildren();for(const result of results){const e=document.createElement('div');e.className='result '+(result.ok?'ok':'fail');e.textContent=(result.ok?'✓ ':'! ')+result.title;const message=document.createElement('span');message.textContent=result.message;e.append(message);$('#results').append(e)}}
async function action(fn){if(busy)return;setBusy(true);$('#error').textContent='';try{const r=await fn();if(r.error)$('#error').textContent=r.error;if(r.items)renderItems(r.items);if(r.destination)$('#destination').value=r.destination;if(r.results){renderResults(r.results);$('#results').scrollIntoView({behavior:'smooth',block:'start'})}const current=await api.state();$('#stage span').textContent=current.stage;if(r.installed)$('#launch').style.display='block'}catch(e){$('#error').textContent='操作失败：'+e.message}finally{setBusy(false)}}
window.addEventListener('pywebviewready',async()=>{api=window.pywebview.api;const d=await api.defaults();$('#destination').value=d.destination;$('#versions-label').textContent='SS '+d.ss_version+' / 插件 '+d.addon_version;$('#scan').onclick=()=>action(()=>api.scan());$('#add').onclick=()=>action(()=>api.browse_blender());$('#folder').onclick=()=>action(()=>api.browse_destination());$('#install').onclick=()=>{const selected=[...document.querySelectorAll('#versions input:checked')].map(e=>e.value);action(()=>api.install($('#destination').value,selected))};$('#launch').onclick=()=>api.launch();setInterval(async()=>{try{const s=await api.state();$('#stage span').textContent=s.stage;if(s.busy)renderResults(s.results)}catch{}},600);if(d.updateMode){await action(()=>api.auto_update());const end=await api.state();if(end.installed&&end.results.every(r=>r.ok))await api.launch()}else await action(()=>api.scan())});
</script></html>
